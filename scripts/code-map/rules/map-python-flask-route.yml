id: map-python-flask-route
message: Python HTTP route decorator
severity: info
language: Python
metadata:
  mapKind: route
rule:
  kind: decorated_definition
  all:
    - has:
        kind: decorator
        regex: '@(app|router)\.(route|get|post|put|delete|patch)\b'
    - has:
        kind: function_definition
        has:
          field: name
          pattern: $NAME
