id: map-export-function
message: exported function or generator
severity: info
language: JavaScript
metadata:
  mapKind: function
rule:
  any:
    - kind: function_declaration
    - kind: generator_function_declaration
  inside:
    kind: export_statement
    not:
      has:
        regex: '^default$'
  not:
    has:
      regex: '^async$'
  has:
    field: name
    pattern: $NAME
