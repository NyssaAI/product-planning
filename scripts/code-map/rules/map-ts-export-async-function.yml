id: map-ts-export-async-function
message: exported async function
severity: info
language: TypeScript
metadata:
  mapKind: async-function
rule:
  any:
    - kind: function_declaration
    - kind: generator_function_declaration
  inside:
    kind: export_statement
    not:
      has:
        regex: '^default$'
  has:
    regex: '^async$'
  all:
    - has:
        field: name
        pattern: $NAME
