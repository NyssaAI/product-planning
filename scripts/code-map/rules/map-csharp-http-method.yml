id: map-csharp-http-method
message: C# HTTP method attribute
severity: info
language: CSharp
metadata:
  mapKind: route
rule:
  kind: method_declaration
  all:
    - has:
        kind: attribute_list
        has:
          kind: attribute
          regex: ^Http(Get|Post|Put|Delete|Patch)
    - has:
        field: name
        pattern: $NAME
