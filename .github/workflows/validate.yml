name: Validate standalone plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run assemble
      - run: npm run assemble:write
      - run: npm run assemble
      - run: npm run validate
      - run: npm test
      - run: npm run eval:prepare
      - run: npm run eval:report
      - run: npm pack --dry-run
